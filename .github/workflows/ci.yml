name: Framework, package and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/langgraph-checkpoint-documentdb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - name: Genuine framework and offline database contracts
        run: python -m pytest -q
      - name: Build distribution artifacts
        run: python -m build --no-isolation
      - name: Verify wheel installation instead of source import
        run: |
          python -m pip uninstall -y langgraph-checkpoint-documentdb
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c 'from langgraph_checkpoint_documentdb import DocumentDBSaver; from langgraph.checkpoint.base import BaseCheckpointSaver; assert issubclass(DocumentDBSaver, BaseCheckpointSaver)'
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements-dev.lock --require-hashes
      - name: Cross-process coordinator offline guards
        working-directory: .
        run: python -m unittest discover -s integration -p 'test_offline.py'
      - name: Explicit live gate must reject missing consent
        shell: bash
        run: |
          if env -u DOCUMENTDB_LIVE python -m pytest -q --live >live-refusal.log 2>&1; then
            echo 'Live gate unexpectedly accepted missing consent'
            exit 1
          fi
          grep -q 'Live gate requires DOCUMENTDB_LIVE=1' live-refusal.log
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/vercel-ai-memory-documentdb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: packages/vercel-ai-memory-documentdb/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Compiled tests and actual AI SDK mock-model wiring
        run: npm test
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - name: Verify package tarball installation
        shell: bash
        run: |
          archive="$(npm pack --silent)"
          package="$PWD/$archive"
          temp="$(mktemp -d)"
          cd "$temp"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package"
          node --input-type=module -e 'import {DocumentDBMemory} from "vercel-ai-memory-documentdb"; if (typeof DocumentDBMemory !== "function") process.exit(1)'
      - name: Explicit live gate must reject missing consent
        shell: bash
        run: |
          if env -u MEMORY_LIVE_ALLOW_WRITES -u MEMORY_TEST_DATABASE npm run test:live >live-refusal.log 2>&1; then
            echo 'Live gate unexpectedly accepted missing consent'
            exit 1
          fi
          grep -q 'Live gate requires MEMORY_LIVE_ALLOW_WRITES=true' live-refusal.log
# No Azure credentials, live model calls, resource provisioning, database drops,
# package registry uploads or visibility changes are performed by these jobs.
# Managed and cross-process database acceptance evidence is recorded in TESTED.md.
