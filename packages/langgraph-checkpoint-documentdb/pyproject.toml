[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-documentdb"
version = "0.2.0"
description = "LangGraph checkpointer backed by Azure DocumentDB (works against the local documentdb container too)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Azure DocumentDB" }]
keywords = ["langgraph", "documentdb", "azure", "agent", "memory", "checkpointer"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
]
dependencies = ["pymongo==4.18.3", "langgraph==1.2.15", "langgraph-checkpoint==4.3.0", "azure-identity==1.26.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "mongomock>=4.3", "build>=1", "pip-audit>=2.10", "pip-tools>=7"]

[project.urls]
Homepage = "https://github.com/Azure-DocumentDB/documentdb-agent-memory"
Source = "https://github.com/Azure-DocumentDB/documentdb-agent-memory"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_checkpoint_documentdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: explicitly requested managed Azure integration gate"]
