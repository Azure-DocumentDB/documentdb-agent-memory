services:
  documentdb:
    # Explicit optional local evaluation image; see TESTED.md for validation scope.
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-1.0-rc2@sha256:906670c630fc94e97b310a4951c5c0b81cb2853de4ccb21f75808031d4e2714d
    ports:
      # Bound to loopback on purpose: this container has no network ACLs and
      # the credentials below are developer-chosen. Do not expose it on 0.0.0.0.
      - "127.0.0.1:${DOCUMENTDB_PORT:-10260}:10260"
    environment:
      USERNAME: ${DOCUMENTDB_USERNAME:?set DOCUMENTDB_USERNAME}
      PASSWORD: ${DOCUMENTDB_PASSWORD:?set DOCUMENTDB_PASSWORD}
      DOCUMENTDB_USAGE_TELEMETRY: "0"
      ENABLE_TELEMETRY: "false"
    volumes:
      - documentdb-data:/data
    restart: "no"

volumes:
  documentdb-data:
